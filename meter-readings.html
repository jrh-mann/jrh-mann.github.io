<div class="meter-readings-container">
    <h1>Utility Meter Readings</h1>
    
    <div class="readings-summary">
        <div class="summary-card electricity">
            <h3>Electricity</h3>
            <p class="current-reading">76.6 kWh</p>
            <p class="usage">Total usage since move-in</p>
        </div>
        <div class="summary-card gas">
            <h3>Gas</h3>
            <p class="current-reading">0 m³</p>
            <p class="usage">Total usage since move-in</p>
        </div>
    </div>

    <div class="chart-controls">
        <button id="toggleViewBtn" class="toggle-btn">Switch to Usage per Period</button>
    </div>
    
    <div class="chart-container">
        <canvas id="meterChart"></canvas>
    </div>

    <div class="data-table">
        <h3>Recent Readings</h3>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Electricity Usage (kWh)</th>
                    <th>Gas Usage (m³)</th>
                    <th>Electricity Total (kWh)</th>
                    <th>Gas Total (m³)</th>
                </tr>
            </thead>
            <tbody id="readingsTable">
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<script>
// Dummy data
const meterData = [
    { date: '2025-07-09', electricity: 47581, gas: null},
    { date: '2025-07-18', electricity: 47642.0, gas: null},
    { date: '2025-07-19', electricity: 47649.7, gas: null},
    { date: '2025-07-20', electricity: 47657.6, gas: null},
    { date: '2025-07-22', electricity: 47665.8, gas: null},
    { date: '2025-07-28', electricity: 47696.6, gas: 37573.2},
    { date: '2025-08-17', electricity: 47802.4, gas: 37575.236},
    { date: '2025-09-05', electricity: 47885.8, gas: null},
    { date: '2025-09-10', electricity: 47919.2, gas: 37580},
    { date: '2025-09-15', electricity: 47959.1, gas: 37584.3 },
    { date: '2025-09-22', electricity: 48008.8, gas: 37591.75},
    { date: '2025-09-25', electricity: 48043.6, gas: 37595.7},
    { date: '2025-10-02', electricity: 48113.9, gas: 37602.8},
    { date: '2025-10-08', electricity: 48179.3, gas: 37610.9},
    { date: '2025-11-01', electricity: 48425.5, gas: 37635.2},
    { date: '2025-11-13', electricity: 48566, gas: 37648},
    { date: '2025-11-26', electricity: 48728.1, gas: 37664.2},
    { date: '2025-12-08', electricity: 48905.9, gas: 37677.5},
    { date: '2025-12-27', electricity: 49078.5, gas: 37694.8}
];

// Calculate baselines (first readings)
const electricityBaseline = meterData[0].electricity;
const gasBaseline = meterData.find(d => d.gas !== null)?.gas || 0;

// Calculate usage from baselines (cumulative)
const usageData = meterData.map(d => ({
    date: d.date,
    rawElectricity: d.electricity,
    rawGas: d.gas,
    electricityUsage: d.electricity - electricityBaseline,
    gasUsage: d.gas !== null ? d.gas - gasBaseline : null
}));

// Calculate period-based usage (gradient between readings)
const periodUsageData = [];
for (let i = 1; i < meterData.length; i++) {
    const prev = meterData[i - 1];
    const curr = meterData[i];
    
    // Calculate days between readings
    const prevDate = new Date(prev.date);
    const currDate = new Date(curr.date);
    const daysBetween = Math.max(1, (currDate - prevDate) / (1000 * 60 * 60 * 24));
    
    // Calculate usage between readings
    const elecUsage = curr.electricity - prev.electricity;
    const gasUsage = (prev.gas !== null && curr.gas !== null) ? curr.gas - prev.gas : null;
    
    // Calculate daily rate for this period
    const elecDailyRate = elecUsage / daysBetween;
    const gasDailyRate = gasUsage !== null ? gasUsage / daysBetween : null;
    
    periodUsageData.push({
        date: curr.date,
        electricityPeriodUsage: elecUsage,
        gasPeriodUsage: gasUsage,
        electricityDailyRate: elecDailyRate,
        gasDailyRate: gasDailyRate,
        daysBetween: daysBetween
    });
}

// Track current view mode
let viewMode = 'cumulative'; // 'cumulative' or 'usage'

// Create chart
const ctx = document.getElementById('meterChart').getContext('2d');
const chart = new Chart(ctx, {
    type: 'line',
    data: {
        datasets: [
            {
                label: 'Electricity Usage (kWh)',
                data: usageData.map(d => ({
                    x: d.date,
                    y: d.electricityUsage
                })),
                borderColor: '#3498db',
                backgroundColor: 'rgba(52, 152, 219, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.1,
                yAxisID: 'y'
            },
            {
                label: 'Gas Usage (m³)',
                data: usageData.filter(d => d.gasUsage !== null).map(d => ({
                    x: d.date,
                    y: d.gasUsage
                })),
                borderColor: '#e74c3c',
                backgroundColor: 'rgba(231, 76, 60, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.1,
                yAxisID: 'y1'
            }
        ]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
            mode: 'index',
            intersect: false,
        },
        plugins: {
            title: {
                display: true,
                text: 'Cumulative Usage Since Move-in (July 9th)',
                font: {
                    size: 18,
                    weight: 'bold'
                }
            },
            legend: {
                position: 'top',
            },
            tooltip: {
                callbacks: {
                    label: function(context) {
                        let label = context.dataset.label || '';
                        if (label) {
                            label += ': ';
                        }
                        if (context.parsed.y !== null) {
                            label += context.parsed.y.toFixed(1);
                            if (viewMode === 'usage') {
                                // Find the corresponding period data
                                const dataPoint = periodUsageData.find(d => d.date === context.label);
                                if (dataPoint) {
                                    const days = dataPoint.daysBetween.toFixed(1);
                                    const dailyRate = context.datasetIndex === 0 ? 
                                        dataPoint.electricityDailyRate.toFixed(2) : 
                                        dataPoint.gasDailyRate?.toFixed(2);
                                    label += ` (${days} days, ${dailyRate}/day)`;
                                }
                            }
                        }
                        return label;
                    }
                }
            }
        },
        scales: {
            x: {
                type: 'time',
                time: {
                    unit: 'day',
                    displayFormats: {
                        day: 'MMM dd'
                    }
                },
                display: true,
                title: {
                    display: true,
                    text: 'Date'
                }
            },
            y: {
                type: 'linear',
                display: true,
                position: 'left',
                title: {
                    display: true,
                    text: 'Electricity (kWh)',
                    color: '#3498db'
                },
                ticks: {
                    color: '#3498db'
                }
            },
            y1: {
                type: 'linear',
                display: true,
                position: 'right',
                title: {
                    display: true,
                    text: 'Gas (m³)',
                    color: '#e74c3c'
                },
                ticks: {
                    color: '#e74c3c'
                },
                grid: {
                    drawOnChartArea: false,
                }
            }
        }
    }
});

// Toggle between cumulative and usage per period views
document.getElementById('toggleViewBtn').addEventListener('click', function() {
    if (viewMode === 'cumulative') {
        // Switch to usage per period view (normalized by days)
        viewMode = 'usage';
        this.textContent = 'Switch to Cumulative View';
        
        chart.data.datasets[0].data = periodUsageData.map(d => ({
            x: d.date,
            y: d.electricityDailyRate
        }));
        
        chart.data.datasets[1].data = periodUsageData.filter(d => d.gasDailyRate !== null).map(d => ({
            x: d.date,
            y: d.gasDailyRate
        }));
        
        chart.options.plugins.title.text = 'Daily Usage Rate by Period';
        chart.options.scales.y.title.text = 'Electricity per Day (kWh/day)';
        chart.options.scales.y1.title.text = 'Gas per Day (m³/day)';
        
    } else {
        // Switch back to cumulative view
        viewMode = 'cumulative';
        this.textContent = 'Switch to Usage per Period';
        
        chart.data.datasets[0].data = usageData.map(d => ({
            x: d.date,
            y: d.electricityUsage
        }));
        
        chart.data.datasets[1].data = usageData.filter(d => d.gasUsage !== null).map(d => ({
            x: d.date,
            y: d.gasUsage
        }));
        
        chart.options.plugins.title.text = 'Cumulative Usage Since Move-in (July 9th)';
        chart.options.scales.y.title.text = 'Electricity (kWh)';
        chart.options.scales.y1.title.text = 'Gas (m³)';
    }
    
    chart.update();
});

// Populate table
function populateTable() {
    const tableBody = document.getElementById('readingsTable');
    
    tableBody.innerHTML = usageData.map(reading => `
        <tr>
            <td>${new Date(reading.date).toLocaleDateString('en-GB')}</td>
            <td>${reading.electricityUsage.toLocaleString()}</td>
            <td>${reading.gasUsage !== null ? reading.gasUsage.toLocaleString() : 'No data'}</td>
            <td>${reading.rawElectricity.toLocaleString()}</td>
            <td>${reading.rawGas !== null ? reading.rawGas.toLocaleString() : 'No data'}</td>
        </tr>
    `).join('');
}

populateTable();

// ================= Estimator UI =================
// Add controls below the table for selecting a range and estimating monthly usage and cost
const container = document.querySelector('.meter-readings-container');
const estimatorSection = document.createElement('div');
estimatorSection.className = 'usage-estimator';
estimatorSection.innerHTML = `
    <h3>Usage & Cost Estimator</h3>
    <div class="estimator-controls">
        <div class="control-group">
            <label for="fromDate">From date</label>
            <input type="date" id="fromDate" />
        </div>
        <div class="control-group">
            <label for="toDate">To date</label>
            <input type="date" id="toDate" />
        </div>
        <div class="control-group">
            <label for="elecUnitP">Electricity unit rate (p/kWh)</label>
            <input type="number" id="elecUnitP" step="0.01" min="0" placeholder="26.41" />
        </div>
        <div class="control-group">
            <label for="elecStandingP">Electricity standing (p/day)</label>
            <input type="number" id="elecStandingP" step="0.01" min="0" placeholder="39.20" />
        </div>
        <div class="control-group">
            <label for="gasUnitP">Gas unit rate (p/kWh)</label>
            <input type="number" id="gasUnitP" step="0.01" min="0" placeholder="6.56" />
        </div>
        <div class="control-group">
            <label for="gasStandingP">Gas standing (p/day)</label>
            <input type="number" id="gasStandingP" step="0.01" min="0" placeholder="27.72" />
        </div>
        <div class="control-group">
            <label for="gasKwhPerM3">Gas conversion (kWh per m³)</label>
            <input type="number" id="gasKwhPerM3" step="0.01" min="0" placeholder="11.20" />
        </div>
    </div>
    <div class="estimator-results">
        <div class="result-card">
            <h4>Electricity</h4>
            <p><strong>Usage in range:</strong> <span id="elecRangeUsage">-</span> kWh</p>
            <p><strong>Days in range:</strong> <span id="elecDays">-</span> days</p>
            <p><strong>Daily average:</strong> <span id="elecDailyAvg">-</span> kWh/day</p>
            <p><strong>Monthly extrapolation:</strong> <span id="elecMonthly">-</span> kWh</p>
            <p><strong>Monthly energy cost:</strong> £<span id="elecMonthlyEnergyCost">-</span></p>
            <p><strong>Monthly standing charge:</strong> £<span id="elecMonthlyStanding">-</span></p>
            <p><strong>Total monthly cost:</strong> £<span id="elecMonthlyCost">-</span></p>
        </div>
        <div class="result-card">
            <h4>Gas</h4>
            <p><strong>Usage in range:</strong> <span id="gasRangeUsage">-</span> m³</p>
            <p><strong>Usage in range (kWh):</strong> <span id="gasRangeUsageKwh">-</span> kWh</p>
            <p><strong>Days in range:</strong> <span id="gasDays">-</span> days</p>
            <p><strong>Daily average:</strong> <span id="gasDailyAvg">-</span> m³/day</p>
            <p><strong>Monthly extrapolation:</strong> <span id="gasMonthly">-</span> m³</p>
            <p><strong>Monthly extrapolation (kWh):</strong> <span id="gasMonthlyKwh">-</span> kWh</p>
            <p><strong>Monthly energy cost:</strong> £<span id="gasMonthlyEnergyCost">-</span></p>
            <p><strong>Monthly standing charge:</strong> £<span id="gasMonthlyStanding">-</span></p>
            <p><strong>Total monthly cost:</strong> £<span id="gasMonthlyCost">-</span></p>
        </div>
    </div>
    <p class="estimator-note">Tip: click two points on the chart to auto-fill the date range. Costs include standing charges; gas cost uses kWh conversion.</p>
`;
container.appendChild(estimatorSection);

// Helper: parse date string (YYYY-MM-DD) to Date at midnight local
function d(dateStr) { return new Date(dateStr + 'T00:00:00'); }

// Interpolate cumulative reading at an arbitrary date using linear interpolation
function interpolateReading(series, date) {
    // series is array of { date: 'YYYY-MM-DD', value: number } sorted by date
    const t = date.getTime();
    for (let i = 0; i < series.length - 1; i++) {
        const a = series[i];
        const b = series[i + 1];
        const ta = d(a.date).getTime();
        const tb = d(b.date).getTime();
        if (t === ta) return a.value;
        if (t > ta && t < tb) {
            const ratio = (t - ta) / (tb - ta);
            return a.value + ratio * (b.value - a.value);
        }
    }
    // If before first or after last, clamp to nearest known
    if (t <= d(series[0].date).getTime()) return series[0].value;
    return series[series.length - 1].value;
}

// Build cumulative series for interpolation (raw totals, not usage)
const elecSeries = meterData.map(r => ({ date: r.date, value: r.electricity }));
const gasSeries = meterData.filter(r => r.gas !== null).map(r => ({ date: r.date, value: r.gas }));

function fmt(n, digits = 1) {
    if (Number.isNaN(n) || n === null || n === undefined) return '-';
    return Number(n).toLocaleString('en-GB', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function recalcEstimator() {
    const fromInput = document.getElementById('fromDate');
    const toInput = document.getElementById('toDate');
    const elecUnitP = parseFloat(document.getElementById('elecUnitP').value) || 0; // p/kWh
    const elecStandingP = parseFloat(document.getElementById('elecStandingP').value) || 0; // p/day
    const gasUnitP = parseFloat(document.getElementById('gasUnitP').value) || 0; // p/kWh
    const gasStandingP = parseFloat(document.getElementById('gasStandingP').value) || 0; // p/day
    const gasKwhPerM3 = parseFloat(document.getElementById('gasKwhPerM3').value) || 0; // kWh per m3

    if (!fromInput.value || !toInput.value) return; // wait until both are set
    const from = d(fromInput.value);
    const to = d(toInput.value);
    if (to < from) return; // invalid range

    const dayMs = 24 * 60 * 60 * 1000;
    const days = Math.max(1, Math.round((to - from) / dayMs) + 1); // inclusive days
    const monthlyDays = 30.44; // average month length

    // Electricity usage between dates via interpolation of cumulative totals
    const elecStart = interpolateReading(elecSeries, from);
    const elecEnd = interpolateReading(elecSeries, to);
    const elecUsage = Math.max(0, elecEnd - elecStart);
    const elecDaily = elecUsage / days;
    const elecMonthly = elecDaily * monthlyDays;
    const elecUnitGBP = elecUnitP / 100;
    const elecStandingGBPDay = elecStandingP / 100;
    const elecMonthlyEnergyCost = elecMonthly * elecUnitGBP;
    const elecMonthlyStanding = monthlyDays * elecStandingGBPDay;
    const elecMonthlyCost = elecMonthlyEnergyCost + elecMonthlyStanding;

    // Gas (only if we have any gas data)
    let gasUsage = null, gasDaily = null, gasMonthly = null, gasMonthlyKwh = null,
        gasMonthlyEnergyCost = null, gasMonthlyStanding = null, gasMonthlyCost = null, gasDays = days, gasRangeKwh = null;
    if (gasSeries.length >= 1) {
        const gasStart = interpolateReading(gasSeries, from);
        const gasEnd = interpolateReading(gasSeries, to);
        gasUsage = Math.max(0, gasEnd - gasStart);
        gasDaily = gasUsage / days;
        gasMonthly = gasDaily * monthlyDays; // m3
        gasRangeKwh = gasUsage * gasKwhPerM3; // kWh for the selected range
        gasMonthlyKwh = gasMonthly * gasKwhPerM3; // monthly kWh equivalent
        const gasUnitGBP = gasUnitP / 100; // £ per kWh
        const gasStandingGBPDay = gasStandingP / 100; // £ per day
        gasMonthlyEnergyCost = gasMonthlyKwh * gasUnitGBP;
        gasMonthlyStanding = monthlyDays * gasStandingGBPDay;
        gasMonthlyCost = gasMonthlyEnergyCost + gasMonthlyStanding;
    }

    // Update UI
    document.getElementById('elecRangeUsage').textContent = fmt(elecUsage);
    document.getElementById('elecDays').textContent = days.toString();
    document.getElementById('elecDailyAvg').textContent = fmt(elecDaily);
    document.getElementById('elecMonthly').textContent = fmt(elecMonthly);
    document.getElementById('elecMonthlyEnergyCost').textContent = fmt(elecMonthlyEnergyCost, 2);
    document.getElementById('elecMonthlyStanding').textContent = fmt(elecMonthlyStanding, 2);
    document.getElementById('elecMonthlyCost').textContent = fmt(elecMonthlyCost, 2);

    document.getElementById('gasRangeUsage').textContent = gasUsage === null ? '-' : fmt(gasUsage);
    document.getElementById('gasRangeUsageKwh').textContent = gasRangeKwh === null ? '-' : fmt(gasRangeKwh);
    document.getElementById('gasDays').textContent = gasUsage === null ? '-' : days.toString();
    document.getElementById('gasDailyAvg').textContent = gasUsage === null ? '-' : fmt(gasDaily);
    document.getElementById('gasMonthly').textContent = gasUsage === null ? '-' : fmt(gasMonthly);
    document.getElementById('gasMonthlyKwh').textContent = gasMonthlyKwh === null ? '-' : fmt(gasMonthlyKwh);
    document.getElementById('gasMonthlyEnergyCost').textContent = gasMonthlyEnergyCost === null ? '-' : fmt(gasMonthlyEnergyCost, 2);
    document.getElementById('gasMonthlyStanding').textContent = gasMonthlyStanding === null ? '-' : fmt(gasMonthlyStanding, 2);
    document.getElementById('gasMonthlyCost').textContent = gasMonthlyCost === null ? '-' : fmt(gasMonthlyCost, 2);
}

// Wire inputs
['fromDate','toDate','elecUnitP','elecStandingP','gasUnitP','gasStandingP','gasKwhPerM3'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', recalcEstimator);
    el.addEventListener('change', recalcEstimator);
});

// Pre-fill with last two dates and default prices
document.getElementById('elecUnitP').value = '26.41';
document.getElementById('elecStandingP').value = '39.20';
document.getElementById('gasUnitP').value = '6.56';
document.getElementById('gasStandingP').value = '27.72';
document.getElementById('gasKwhPerM3').value = '11.20';
const lastTwo = meterData.slice(-2).map(r => r.date);
document.getElementById('fromDate').value = lastTwo[0];
document.getElementById('toDate').value = lastTwo[1];
recalcEstimator();

// Allow clicking on chart points to set dates
let clickStage = 0; // 0: next click sets from, 1: sets to, then toggles
document.getElementById('meterChart').onclick = function(evt) {
    const points = chart.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, false);
    if (points.length) {
        const firstPoint = points[0];
        const datasetIndex = firstPoint.datasetIndex;
        const index = firstPoint.index;
        const dataset = chart.data.datasets[datasetIndex];
        const point = dataset.data[index];
        const isoDate = typeof point.x === 'string' ? point.x : new Date(point.x).toISOString().slice(0,10);
        if (clickStage === 0) {
            document.getElementById('fromDate').value = isoDate;
            clickStage = 1;
        } else {
            document.getElementById('toDate').value = isoDate;
            clickStage = 0;
        }
        recalcEstimator();
    }
};
</script>
