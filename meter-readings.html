---
layout: default
title: Meter Readings
permalink: /meter-readings/
---

<div class="meter-readings-container">
    <h1>Utility Meter Readings</h1>
    
    <div class="readings-summary">
        <div class="summary-card electricity">
            <h3>Electricity</h3>
            <p class="current-reading">76.6 kWh</p>
            <p class="usage">Total usage since move-in</p>
        </div>
        <div class="summary-card gas">
            <h3>Gas</h3>
            <p class="current-reading">0 m³</p>
            <p class="usage">Total usage since move-in</p>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="meterChart"></canvas>
    </div>

    <div class="data-table">
        <h3>Recent Readings</h3>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Electricity Usage (kWh)</th>
                    <th>Gas Usage (m³)</th>
                    <th>Electricity Total (kWh)</th>
                    <th>Gas Total (m³)</th>
                </tr>
            </thead>
            <tbody id="readingsTable">
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<script>
// Dummy data
const meterData = [
    { date: '2025-07-09', electricity: 47581, gas: null},
    { date: '2025-07-18', electricity: 47642.0, gas: null},
    { date: '2025-07-19', electricity: 47649.7, gas: null},
    { date: '2025-07-20', electricity: 47657.6, gas: null},
    { date: '2025-07-22', electricity: 47665.8, gas: null},
    { date: '2025-07-28', electricity: 47696.6, gas: 37573.2},
    { date: '2025-08-17', electricity: 47802.4, gas: 37575.236}
];

// Calculate baselines (first readings)
const electricityBaseline = meterData[0].electricity;
const gasBaseline = meterData.find(d => d.gas !== null)?.gas || 0;

// Calculate usage from baselines
const usageData = meterData.map(d => ({
    date: d.date,
    rawElectricity: d.electricity,
    rawGas: d.gas,
    electricityUsage: d.electricity - electricityBaseline,
    gasUsage: d.gas !== null ? d.gas - gasBaseline : null
}));

// Create chart
const ctx = document.getElementById('meterChart').getContext('2d');
const chart = new Chart(ctx, {
    type: 'line',
    data: {
        datasets: [
            {
                label: 'Electricity Usage (kWh)',
                data: usageData.map(d => ({
                    x: d.date,
                    y: d.electricityUsage
                })),
                borderColor: '#3498db',
                backgroundColor: 'rgba(52, 152, 219, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.1,
                yAxisID: 'y'
            },
            {
                label: 'Gas Usage (m³)',
                data: usageData.filter(d => d.gasUsage !== null).map(d => ({
                    x: d.date,
                    y: d.gasUsage
                })),
                borderColor: '#e74c3c',
                backgroundColor: 'rgba(231, 76, 60, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.1,
                yAxisID: 'y1'
            }
        ]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
            mode: 'index',
            intersect: false,
        },
        plugins: {
            title: {
                display: true,
                text: 'Utility Usage Since Move-in (July 9th)',
                font: {
                    size: 18,
                    weight: 'bold'
                }
            },
            legend: {
                position: 'top',
            }
        },
        scales: {
            x: {
                type: 'time',
                time: {
                    unit: 'day',
                    displayFormats: {
                        day: 'MMM dd'
                    }
                },
                display: true,
                title: {
                    display: true,
                    text: 'Date'
                }
            },
            y: {
                type: 'linear',
                display: true,
                position: 'left',
                title: {
                    display: true,
                    text: 'Electricity Usage (kWh)',
                    color: '#3498db'
                },
                ticks: {
                    color: '#3498db'
                }
            },
            y1: {
                type: 'linear',
                display: true,
                position: 'right',
                title: {
                    display: true,
                    text: 'Gas Usage (m³)',
                    color: '#e74c3c'
                },
                ticks: {
                    color: '#e74c3c'
                },
                grid: {
                    drawOnChartArea: false,
                }
            }
        }
    }
});

// Populate table
function populateTable() {
    const tableBody = document.getElementById('readingsTable');
    
    tableBody.innerHTML = usageData.map(reading => `
        <tr>
            <td>${new Date(reading.date).toLocaleDateString('en-GB')}</td>
            <td>${reading.electricityUsage.toLocaleString()}</td>
            <td>${reading.gasUsage !== null ? reading.gasUsage.toLocaleString() : 'No data'}</td>
            <td>${reading.rawElectricity.toLocaleString()}</td>
            <td>${reading.rawGas !== null ? reading.rawGas.toLocaleString() : 'No data'}</td>
        </tr>
    `).join('');
}

populateTable();
</script>
